services:
  app:
    build: .
    image: petitpanier:2.0
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
  stats:
    build: .
    image: nginx:alpine
    ports:
      - "8082:80"
